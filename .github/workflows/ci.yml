name: CI/CD Pipeline

on:
  push:
    braches: ['main']
  pull_request:
    branches: ['main']

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
    
    - name: Install dependencies
      run: npm install
    
    - name: Run Unit Tests
      run: npm test

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with: 
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/firstproject-web:latest

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST}}
        username: ${{ secrets.EC2_USER}}
        key: ${{ secrets.EC2_SSH_KEY}}
        script: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/firstproject-web:latest
          docker stop web-app || true
          docker rm web-app || true
          docker run -d --name web-app --restart always -p 3000:3000 ${{ secrets.DOCKERHUB_USERNAME }}/firstproject-web:latest