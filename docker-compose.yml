

services:
  web:
    build: .
    container_name: devops_web_app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_USER= postgres
      - DB_PASSWORD=password123
      - DB_NAME=testdb
      - DB_PORT=5432
    depends_on:
      - db
    restart: always

  db:
    image: postgres:15-alpine
    container_name: devops_postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: testdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata: